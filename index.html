<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StS2 Monster Battle Simulator</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #121212; color: #fff; margin: 20px; }
    
    /* Top Right Streak Display */
    .streak-tracker {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .streak-tracker span { color: #ffbf00; font-size: 18px; }

    .battlefield { display: flex; justify-content: center; gap: 40px; margin: 20px 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 220px; border: 1px solid #333; position: relative; }
    .card img { width: 120px; height: 120px; object-fit: contain; margin: 10px 0; background: #2a2a2a; border-radius: 8px; padding: 5px; }
    .hp-bar { background: #444; height: 18px; border-radius: 9px; overflow: hidden; margin: 10px 0; }
    .hp-fill { background: #4caf50; height: 100%; width: 100%; transition: width 0.3s; }
    #img1 { transform: scaleX(-1); }
    
    /* Betting Option Controls */
    .bet-option { margin-top: 12px; font-size: 14px; background: #2a2a2a; padding: 6px; border-radius: 6px; cursor: pointer; display: block; }
    .bet-option input { cursor: pointer; margin-right: 6px; }

    /* Status Badges Styling */
    .status-container { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 32px; margin-top: 8px; }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 3px; }
    .badge-block { background: #2575fc; color: #fff; }
    .badge-str { background: #ff4757; color: #fff; }
    .badge-weak { background: #ffa502; color: #000; }
    .badge-vuln { background: #ff6b81; color: #fff; }

    select, button { padding: 8px 16px; font-size: 15px; border-radius: 6px; border: none; cursor: pointer; }
    button { background: #ff4757; color: white; font-weight: bold; margin: 5px; }
    button:hover { background: #ff6b81; }
    button:disabled { background: #555; cursor: not-allowed; }
    #log { background: #000; padding: 15px; border-radius: 8px; height: 180px; overflow-y: auto; text-align: left; font-family: monospace; border: 1px solid #333; max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>

  <!-- Streak Display -->
  <div class="streak-tracker">🔥 Win Streak: <span id="streakCount">0</span></div>

  <h1>Slay the Spire 2 Monster Battle</h1>

  <div class="battlefield">
    <!-- Fighter 1 -->
    <div class="card">
      <select id="sel1" onchange="resetBattle()"></select>
      <img id="img1" src="" alt="Monster 1">
      <div class="hp-bar"><div id="hp1" class="hp-fill"></div></div>
      <div id="status1">100 / 100 HP</div>
      <div id="badges1" class="status-container"></div>
      
      <label class="bet-option">
        <input type="radio" name="bet" value="1" checked> Bet on Fighter 1
      </label>
    </div>

    <!-- Fighter 2 -->
    <div class="card">
      <select id="sel2" onchange="resetBattle()"></select>
      <img id="img2" src="" alt="Monster 2">
      <div class="hp-bar"><div id="hp2" class="hp-fill"></div></div>
      <div id="status2">100 / 100 HP</div>
      <div id="badges2" class="status-container"></div>

      <label class="bet-option">
        <input type="radio" name="bet" value="2"> Bet on Fighter 2
      </label>
    </div>
  </div>

  <button id="turnBtn" onclick="nextTurn()">Start Battle</button>
  <button onclick="randomizeFighters()">🎲 Randomize</button>
  <button onclick="swapFighters()">⇄ Swap</button>
  <button onclick="resetBattle()">Reset</button>

  <h3>Combat Log</h3>
  <div id="log"></div>

  <script type="module">
    import { monsterClasses } from './monsters.js';

    // Populate UI Dropdowns
    const sel1 = document.getElementById('sel1');
    const sel2 = document.getElementById('sel2');

    monsterClasses.forEach((ClassRef, index) => {
      let tempInstance = new ClassRef();
      sel1.add(new Option(tempInstance.name, index));
      sel2.add(new Option(tempInstance.name, index));
    });
    if (monsterClasses.length > 1) {
      sel1.selectedIndex = Math.floor(Math.random() * monsterClasses.length);
      sel2.selectedIndex = Math.floor(Math.random() * monsterClasses.length);
    }

    // Battle State Variables
    let fighter1 = null;
    let fighter2 = null;
    let currentTurn = 1;
    let isBattleActive = false;
    let winStreak = 0;

    window.resetBattle = function() {
      fighter1 = new monsterClasses[sel1.value]();
      fighter2 = new monsterClasses[sel2.value]();
      currentTurn = 1;
      isBattleActive = false;

      // Re-enable radio buttons for new betting
      document.querySelectorAll('input[name="bet"]').forEach(r => r.disabled = false);

      document.getElementById('turnBtn').textContent = "Start Battle";
      document.getElementById('turnBtn').disabled = false;
      document.getElementById('log').innerHTML = "<p>Place your bet and click Start Battle!</p>";

      updateUI();
    }

    window.swapFighters = function() {
      const tempIndex = sel1.selectedIndex;
      sel1.selectedIndex = sel2.selectedIndex;
      sel2.selectedIndex = tempIndex;

      resetBattle();
    }

    window.randomizeFighters = function() {
      if (monsterClasses.length === 0) return;

      const idx1 = Math.floor(Math.random() * monsterClasses.length);
      let idx2 = Math.floor(Math.random() * monsterClasses.length);

      if (monsterClasses.length > 1) {
        while (idx2 === idx1) {
          idx2 = Math.floor(Math.random() * monsterClasses.length);
        }
      }

      sel1.selectedIndex = idx1;
      sel2.selectedIndex = idx2;

      resetBattle();
    }

    function renderBadges(monster, badgeDivId) {
      const container = document.getElementById(badgeDivId);
      let badgesHTML = '';

      if (monster.block > 0) {
        badgesHTML += `<span class="badge badge-block">🛡️ ${monster.block}</span>`;
      }
      if (monster.strength !== 0) {
        badgesHTML += `<span class="badge badge-str">💪 ${monster.strength > 0 ? '+' : ''}${monster.strength}</span>`;
      }
      if (monster.weakTurns > 0) {
        badgesHTML += `<span class="badge badge-weak">🥀 Weak (${monster.weakTurns})</span>`;
      }
      if (monster.vulnTurns > 0) {
        badgesHTML += `<span class="badge badge-vuln">💔 Vuln (${monster.vulnTurns})</span>`;
      }
      if (monster.artifact > 0) {
        badgesHTML += `<span class="badge badge-artifact">⚙️ Artifact (${monster.artifact})</span>`;
      }
      if (monster.slippery > 0) {
        badgesHTML += `<span class="badge badge-slippery">💧 Slippery (${monster.slippery})</span>`;
      }
      if (monster.plating > 0) {
        badgesHTML += `<span class="badge badge-plating">🪖 Plating (${monster.plating})</span>`;
      }
      if (monster.steam > 0) {
        badgesHTML += `<span class="badge badge-plating">💨 Steam Eruption (${monster.steam})</span>`;
      }
      if (monster.intangible > 0) {
        badgesHTML += `<span class="badge badge-intangible">👻 Intangible (${monster.intangible})</span>`;
      }
      if (monster.soaring == true) {
        badgesHTML += `<span class="badge badge-soaring">🦉 Soaring </span>`;
      }

      container.innerHTML = badgesHTML;
    }

    function updateUI() {
      // Images
      document.getElementById('img1').src = fighter1.image;
      document.getElementById('img2').src = fighter2.image;

      // HP & Health Bars
      document.getElementById('status1').textContent = `${fighter1.hp} / ${fighter1.maxHp} HP`;
      document.getElementById('status2').textContent = `${fighter2.hp} / ${fighter2.maxHp} HP`;
      document.getElementById('hp1').style.width = `${Math.max(0, (fighter1.hp / fighter1.maxHp) * 100)}%`;
      document.getElementById('hp2').style.width = `${Math.max(0, (fighter2.hp / fighter2.maxHp) * 100)}%`;

      // Status Effect Badges
      renderBadges(fighter1, 'badges1');
      renderBadges(fighter2, 'badges2');
      
      // Update streak UI
      document.getElementById('streakCount').textContent = winStreak;
    }

    window.nextTurn = function() {
      let logDiv = document.getElementById('log');
      let logMessages = [];

      if (!isBattleActive) {
        isBattleActive = true;
        
        // Lock in bets on start
        document.querySelectorAll('input[name="bet"]').forEach(r => r.disabled = true);

        document.getElementById('turnBtn').textContent = "Next Turn";
        logDiv.innerHTML = "";
        
        const chosenBet = document.querySelector('input[name="bet"]:checked').value;
        const betTargetName = chosenBet === "1" ? fighter1.name : fighter2.name;
        logMessages.push(`🎯 <strong>You bet on: ${betTargetName}</strong>`);
        logMessages.push(`⚔️ <strong>Battle Started: ${fighter1.name} vs ${fighter2.name}!</strong>`);
      }

      logMessages.push(`--- Turn ${currentTurn} ---`);

      // Fighter 1 Turn
      fighter1.onTurn(currentTurn, fighter2, logMessages);
      fighter1.endTurn(currentTurn, fighter2, logMessages);
      
      // Fighter 2 Turn (if still alive)
      if (fighter2.hp > 0) {
        fighter2.onTurn(currentTurn, fighter1, logMessages);
        fighter2.endTurn(currentTurn, fighter1, logMessages);
      }

      // Check Winner
      if (fighter1.hp <= 0 || fighter2.hp <= 0) {
        let winnerIndex = fighter1.hp > 0 ? "1" : (fighter2.hp > 0 ? "2" : "0");
        let winnerName = fighter1.hp > 0 ? fighter1.name : (fighter2.hp > 0 ? fighter2.name : "Draw");
        
        logMessages.push(`🏆 <strong>${winnerName} wins!</strong>`);
        
        // Bet Evaluation
        const userBet = document.querySelector('input[name="bet"]:checked').value;
        if (winnerIndex === userBet) {
          winStreak++;
          logMessages.push(`✨ <strong>Correct Bet! Streak increased to ${winStreak}!</strong>`);
        } else {
          winStreak = 0;
          logMessages.push(`❌ <strong>Incorrect Bet! Streak reset to 0.</strong>`);
        }

        document.getElementById('turnBtn').disabled = true;
        document.getElementById('turnBtn').textContent = "Battle Ended";
      } else {
        currentTurn++;
      }

      // Append logs & scroll
      logMessages.forEach(msg => {
        logDiv.innerHTML += `<p style="margin:4px 0">${msg}</p>`;
      });
      logDiv.scrollTop = logDiv.scrollHeight;

      updateUI();
    }

    // Initial load
    resetBattle();
  </script>
</body>
</html>
